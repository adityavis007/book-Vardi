name: Book Vardi CI/CD Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-quality-and-test:
    name: Flutter Lint, Tests & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Automated Flutter Test Suite
        run: flutter test

      - name: Build Android APK (Verification)
        run: flutter build apk --debug

  cloud-functions-ci:
    name: Cloud Functions CI & Security Trigger Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Run Cloud Functions Tests
        working-directory: functions
        run: npm test
